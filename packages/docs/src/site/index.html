<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capper UI: token-first React design system</title>
    <meta name="description" content="Capper UI is a token first React design system: semantic tokens, atomic components, light and dark themes. Browse foundations and ship consistent UI." />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <script>
      (function () {
        var key = 'capper-ui-theme';
        var stored = localStorage.getItem(key);
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
