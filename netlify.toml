# Capper UI docs site (Vite + React Router SPA)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "pnpm install --frozen-lockfile && pnpm build:docs"
  publish = "packages/docs/dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routes (e.g. /components/button) must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
